*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--sky);color:var(--txt)}
body{font:20px 'VT323',monospace;overflow-x:hidden}

.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px}

.slot{width:120px;height:12px;background:var(--bodyDD);border:4px solid var(--ink);border-radius:3px;box-shadow:inset 0 3px 0 #1a4a40}
.screen{position:relative;background:#2a6e60;border:5px solid var(--ink);border-radius:10px;padding:10px;box-shadow:inset 0 0 0 4px var(--bodyD)}

.zCtl{position:absolute;bottom:18px;left:18px;z-index:6;display:flex;gap:6px;align-items:center}

.fsBtn:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}

.screen:fullscreen,.screen.fs{padding:0;border:0;border-radius:0;box-shadow:none;background:var(--paper)}
.screen:-webkit-full-screen{padding:0;border:0;border-radius:0;box-shadow:none;background:var(--paper)}

.paper select{font:20px 'VT323',monospace;padding:4px 6px;border:4px solid var(--ink);border-radius:6px;background:var(--bodyL);color:var(--ink)}
